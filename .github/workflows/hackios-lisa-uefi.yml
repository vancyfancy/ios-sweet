# Builds the HackiOS UEFI chain for Xiaomi Mi 11 Lite 5G NE (lisa):
#   Mu-Silicium (Project-Silicium) @ hackios's pinned BASE commit
#   + hackios's uefi/mu-silicium.patch (BootShim copies the XNUP payload container
#     to PAYLOAD_BASE; BootManager auto-starts the resident XNU loader from it)
#   + uefi/apply.sh places Mu-Silicium INSIDE the hackios tree so mkxnuimg.py finds it.
# Nothing here touches the phone's storage; artifacts are for `fastboot boot`.
#
# Verified locally (macOS clone @ BASE):
#   - mu-silicium.patch applies cleanly at e51cd877
#   - lisa FD = 0x9FD00000 / 0x200000 (Resources/Configs/lisa.toml, MemoryMapLib.c)
#   - lisa DTB ships upstream (Resources/DTBs/lisa.dtb)
name: hackios-lisa-uefi

on:
  workflow_dispatch: {}

env:
  MU_SHA: e51cd877e31c8fbb322032dc4cb6715e83d25ad3
  # lisa memory map (upstream lisa.toml + MemoryMapLib.c) — QUOTED: unquoted hex
  # gets converted to a signed int32 by the workflow harness (0x9FD00000 -> -1613758464)
  # which then breaks the BootShim assembler.
  FD_BASE: "0x9FD00000"
  FD_SIZE: "0x200000"
  # XNUP payload window (HackiOS value; experiment: adjust if the phone drops USB)
  PAYLOAD_BASE: "0xF0000000"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch HackiOS reference (v0.1.0)
        run: git clone --depth 1 --branch v0.1.0 https://github.com/oosexgang/hackios-xnu-kernel.git hackios

      - name: Prepare Mu-Silicium at BASE + HackiOS UEFI patch
        run: |
          cd hackios/uefi
          bash apply.sh

      - name: Restore Mu-Silicium build output
        uses: actions/cache@v4
        with:
          path: |
            hackios/Mu-Silicium/Build
            hackios/Mu-Silicium/BootShim/BootShim.elf
            hackios/Mu-Silicium/BootShim/BootShim.bin
          key: lisa-uefi-${{ runner.os }}-${{ env.MU_SHA }}-${{ hashFiles('hackios/Mu-Silicium/Resources/Configs/lisa.toml', 'hackios/Mu-Silicium/Resources/MuPatches/**', 'hackios/uefi/mu-silicium.patch') }}

      - name: Build lisa UEFI (RELEASE)
        run: |
          cd hackios/Mu-Silicium
          bash setup_env.sh -p apt
          python3 build_uefi.py -d lisa -r RELEASE

      - name: Bake loader USB payload + lisa boot image
        env:
          UEFI_TARGET: lisa
        run: |
          cd hackios
          ls Mu-Silicium/Build/*/RELEASE_CLANGPDB/FV/
          python3 xnuloader/mkpayload.py -o payload.bin loader.efi=prebuilt/loader.efi --usb
          python3 mkxnuimg.py -p payload.bin -o hackios-lisa-enter.img
          python3 mkxnuimg.py -o hackios-lisa-uefi-only.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hackios-lisa-uefi
          path: |
            hackios/hackios-lisa-enter.img
            hackios/hackios-lisa-uefi-only.img
            hackios/Mu-Silicium/Build/**/SILICIUM_UEFI.fd
